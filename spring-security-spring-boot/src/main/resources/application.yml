server:
  port: ${PORT:8080}

spring:
  profiles:
    default: google
    group:
      mockatoo: [google, microsoft, github, apple, discord, linkedin, x, facebook]

---
spring:
  config.activate.on-profile: google
  security.oauth2.client.registration.google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    client-name: Google
    scope: [openid, profile, email]

---
spring:
  config.activate.on-profile: microsoft
  security.oauth2.client:
    registration.microsoft:
      client-id: ${MICROSOFT_CLIENT_ID}
      client-secret: ${MICROSOFT_CLIENT_SECRET}
      client-name: Microsoft
      scope: [openid, profile, email]
    provider.microsoft:
      issuer-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID}/v2.0

---
spring:
  config.activate.on-profile: github
  security.oauth2.client.registration.github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}

---
spring:
  config.activate.on-profile: apple
  security.oauth2.client:
    registration.apple:
      client-id: ${APPLE_CLIENT_ID}
      client-secret: ${APPLE_CLIENT_SECRET}
      client-name: Apple
      scope: [openid, email]
    provider.apple:
      issuer-uri: https://appleid.apple.com
# Apple returns the authorization response in a cross-site POST.
server.servlet.session.cookie:
  same-site: none
  secure: true

---
spring:
  config.activate.on-profile: discord
  security.oauth2.client:
    registration.discord:
      client-id: ${DISCORD_CLIENT_ID}
      client-secret: ${DISCORD_CLIENT_SECRET}
      client-name: Discord
      client-authentication-method: client_secret_post
      authorization-grant-type: authorization_code
      redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
      scope: [identify, email]
    provider.discord:
      authorization-uri: https://discord.com/oauth2/authorize
      token-uri: https://discord.com/api/oauth2/token
      user-info-uri: https://discord.com/api/users/@me
      user-name-attribute: id

---
spring:
  config.activate.on-profile: linkedin
  security.oauth2.client:
    registration.linkedin:
      client-id: ${LINKEDIN_CLIENT_ID}
      client-secret: ${LINKEDIN_CLIENT_SECRET}
      client-name: LinkedIn
      client-authentication-method: client_secret_post
      scope: [openid, profile, email]
    provider.linkedin:
      issuer-uri: https://www.linkedin.com/oauth

---
spring:
  config.activate.on-profile: x
  security.oauth2.client:
    registration.x:
      client-id: ${X_CLIENT_ID}
      client-secret: ${X_CLIENT_SECRET}
      client-authentication-method: client_secret_basic
      scope: [tweet.read, users.read, users.email]
    provider.x:
      user-info-uri: https://api.x.com/2/users/me?user.fields=confirmed_email
      user-name-attribute: id

---
spring:
  config.activate.on-profile: facebook
  security.oauth2.client:
    registration.facebook:
      client-id: ${FACEBOOK_CLIENT_ID}
      client-secret: ${FACEBOOK_CLIENT_SECRET}
    provider.facebook:
      authorization-uri: https://www.facebook.com/v24.0/dialog/oauth
      token-uri: https://graph.facebook.com/v24.0/oauth/access_token
      user-info-uri: https://graph.facebook.com/v24.0/me?fields=id,name,email
