<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mockatoo Spring Boot Example</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <main>
        <section class="card">
            <a class="brand" href="https://github.com/mockatoo/examples/tree/main/spring-security-spring-boot">
                <span class="brand-logo" aria-hidden="true"></span>
                Mockatoo Spring Boot Example
            </a>
            <th:block th:if="${sessionJson == null}">
                <h1>Welcome back</h1>
                <p>Sign in with one of the providers below. We’ll request access to your basic profile and email where available.</p>
                <p th:if="${param.error}" role="alert" class="error">Sign-in failed. Please try again.</p>
                <div class="providers">
                    <form th:each="provider : ${providers}" method="get"
                          th:action="@{/oauth2/authorization/{id}(id=${provider.registrationId})}">
                        <button type="submit">
                            <img th:src="@{/providers/{id}.svg(id=${provider.registrationId})}" alt="" width="18" height="18">
                            <span th:text="|Sign in with ${provider.clientName}|"></span>
                        </button>
                    </form>
                </div>
            </th:block>
            <th:block th:if="${sessionJson != null}">
                <p class="signed-in">You are logged in</p>
                <h1 class="session-title">Your session</h1>
                <pre class="session-json" tabindex="0" aria-label="Session data"><code th:text="${sessionJson}"></code></pre>
                <a class="cta" href="https://app.mockatoo.globalunderdog.com" target="_blank" rel="noopener noreferrer">Explore Mockatoo</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="secondary">Sign out</button>
                </form>
            </th:block>
        </section>
    </main>
    <script>
        const buttons = document.querySelectorAll("button");
        document.addEventListener("submit", () => {
            for (const button of buttons) button.disabled = true;
        });
        window.addEventListener("pageshow", () => {
            for (const button of buttons) button.disabled = false;
        });
    </script>
</body>
</html>
