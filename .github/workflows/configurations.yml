name: Configurations
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Install the root tools and this example only, not every example.
      - run: pnpm install --frozen-lockfile --filter . --filter ./configurations
      - run: pnpm exec biome check configurations package.json
      - run: pnpm --dir configurations typecheck
