name: Configurations
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - configurations/**
      - .github/workflows/configurations.yml
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: configurations/pnpm-lock.yaml
      # The example is its own pnpm root, with its own lockfile.
      - run: pnpm --dir configurations install --frozen-lockfile
      # Lint, typecheck and the browser tests, the same steps local-ci runs.
      - run: pnpm --dir configurations run ci
