name: oauth4webapi + Hono
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - oauth4webapi-hono/**
      - .github/workflows/oauth4webapi-hono.yml
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: oauth4webapi-hono/pnpm-lock.yaml
      # The example is its own pnpm root, with its own lockfile.
      - run: pnpm --dir oauth4webapi-hono install --frozen-lockfile
      - name: Generate runtime secret
        run: echo "SESSION_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm --dir oauth4webapi-hono exec playwright install --with-deps chromium
      # Lint, typecheck and the browser tests, the same steps local-ci runs.
      - run: pnpm --dir oauth4webapi-hono run ci
        env:
          MOCKATOO_TEST_EMAIL: ${{ secrets.MOCKATOO_TEST_EMAIL }}
          MOCKATOO_TEST_PASSWORD: ${{ secrets.MOCKATOO_TEST_PASSWORD }}
