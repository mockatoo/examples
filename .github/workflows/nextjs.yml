name: Next.js browser tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [better-auth-next, authjs-next]
        runner: [playwright, cypress, selenium]
        include:
          - example: better-auth-next
            secret_name: BETTER_AUTH_SECRET
          - example: authjs-next
            secret_name: AUTH_SECRET
          - runner: playwright
            script: test
          - runner: cypress
            script: test:cypress
          - runner: selenium
            script: test:selenium
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter . --filter ./${{ matrix.example }}
      - if: matrix.runner == 'playwright'
        run: pnpm exec biome check ${{ matrix.example }}
      - if: matrix.runner == 'playwright'
        run: pnpm --dir ${{ matrix.example }} typecheck
      - name: Generate runtime secret
        run: echo "${{ matrix.secret_name }}=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - if: matrix.runner == 'playwright'
        run: pnpm --dir ${{ matrix.example }} exec playwright install --with-deps chromium
      - if: matrix.runner == 'cypress'
        run: pnpm --dir ${{ matrix.example }} exec cypress install
      - run: pnpm --dir ${{ matrix.example }} ${{ matrix.script }}
        env:
          MOCKATOO_TEST_EMAIL: ${{ secrets.MOCKATOO_TEST_EMAIL }}
          MOCKATOO_TEST_PASSWORD: ${{ secrets.MOCKATOO_TEST_PASSWORD }}
      - name: Upload Cypress artifacts
        if: failure() && matrix.runner == 'cypress'
        uses: actions/upload-artifact@v4
        with:
          name: cypress-${{ matrix.example }}
          path: |
            ${{ matrix.example }}/cypress/screenshots
            ${{ matrix.example }}/cypress/videos
          retention-days: 7
