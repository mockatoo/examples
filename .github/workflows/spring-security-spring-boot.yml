name: Spring Security + Spring Boot
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - spring-security-spring-boot/**
      - .github/workflows/spring-security-spring-boot.yml
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: spring-security-spring-boot/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: spring-security-spring-boot/pom.xml
      # The example is its own pnpm root, with its own lockfile.
      - run: pnpm --dir spring-security-spring-boot install --frozen-lockfile
      - run: pnpm --dir spring-security-spring-boot exec playwright install --with-deps chromium
      # Lint, typecheck and the browser tests, the same steps local-ci runs.
      - run: pnpm --dir spring-security-spring-boot run ci
        env:
          MOCKATOO_TEST_EMAIL: ${{ secrets.MOCKATOO_TEST_EMAIL }}
          MOCKATOO_TEST_PASSWORD: ${{ secrets.MOCKATOO_TEST_PASSWORD }}
