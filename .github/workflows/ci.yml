name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Generate runtime secret
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm --dir authjs-next exec playwright install --with-deps chromium
      - run: pnpm --dir authjs-next test
        env:
          MOCK_EMAIL: ${{ secrets.MOCK_EMAIL }}
          MOCK_PASSWORD: ${{ secrets.MOCK_PASSWORD }}
