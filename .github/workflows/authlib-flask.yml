name: Authlib + Flask
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile --filter . --filter ./authlib-flask
      - run: pnpm exec biome check authlib-flask
      - run: pnpm --dir authlib-flask lint
      - run: pnpm --dir authlib-flask typecheck
      - name: Generate runtime secret
        run: echo "FLASK_SECRET_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm --dir authlib-flask exec playwright install --with-deps chromium
      - run: pnpm --dir authlib-flask test
        env:
          MOCKATOO_TEST_EMAIL: ${{ secrets.MOCKATOO_TEST_EMAIL }}
          MOCKATOO_TEST_PASSWORD: ${{ secrets.MOCKATOO_TEST_PASSWORD }}
