name: Laravel + Socialite
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - socialite-laravel/**
      - .github/workflows/socialite-laravel.yml
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: socialite-laravel/pnpm-lock.yaml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, curl, zip
          tools: composer:v2
      # The example is its own pnpm root, with its own lockfile.
      - run: pnpm --dir socialite-laravel install --frozen-lockfile
      - name: Generate runtime secret
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm --dir socialite-laravel exec playwright install --with-deps chromium
      # Lint, typecheck and the browser tests, the same steps local-ci runs.
      - run: pnpm --dir socialite-laravel run ci
        env:
          MOCKATOO_TEST_EMAIL: ${{ secrets.MOCKATOO_TEST_EMAIL }}
          MOCKATOO_TEST_PASSWORD: ${{ secrets.MOCKATOO_TEST_PASSWORD }}
