name: Better Auth + Next.js
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Install the root tools and this example only, not every example.
      - run: pnpm install --frozen-lockfile --filter . --filter ./better-auth-next
      - run: pnpm exec biome check better-auth-next
      - run: pnpm --dir better-auth-next typecheck
      - name: Generate runtime secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm --dir better-auth-next exec playwright install --with-deps chromium
      - run: pnpm --dir better-auth-next test
        env:
          MOCKATOO_TEST_EMAIL: ${{ secrets.MOCKATOO_TEST_EMAIL }}
          MOCKATOO_TEST_PASSWORD: ${{ secrets.MOCKATOO_TEST_PASSWORD }}
