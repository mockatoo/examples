name: Django + allauth
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile --filter . --filter ./allauth-django
      - run: pnpm exec biome check allauth-django
      - run: pnpm --dir allauth-django lint
      - run: pnpm --dir allauth-django typecheck
      - name: Generate runtime secret
        run: echo "DJANGO_SECRET_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm --dir allauth-django exec playwright install --with-deps chromium
      - run: pnpm --dir allauth-django test
        env:
          MOCKATOO_TEST_EMAIL: ${{ secrets.MOCKATOO_TEST_EMAIL }}
          MOCKATOO_TEST_PASSWORD: ${{ secrets.MOCKATOO_TEST_PASSWORD }}
