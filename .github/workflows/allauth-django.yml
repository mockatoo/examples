name: Django + allauth
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - allauth-django/**
      - .github/workflows/allauth-django.yml
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: allauth-django/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # The example is its own pnpm root, with its own lockfile.
      - run: pnpm --dir allauth-django install --frozen-lockfile
      - name: Generate runtime secret
        run: echo "DJANGO_SECRET_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm --dir allauth-django exec playwright install --with-deps chromium
      # Lint, typecheck and the browser tests, the same steps local-ci runs.
      - run: pnpm --dir allauth-django run ci
        env:
          MOCKATOO_TEST_EMAIL: ${{ secrets.MOCKATOO_TEST_EMAIL }}
          MOCKATOO_TEST_PASSWORD: ${{ secrets.MOCKATOO_TEST_PASSWORD }}
